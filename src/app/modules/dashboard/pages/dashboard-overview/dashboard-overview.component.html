<div class="rx-page">
  <div class="rx-head">
    <h1 class="rx-title">Dashboard</h1>
    <div class="rx-actions">
      @if ((data()?.active_calls ?? 0) > 0) { <span class="rx-live"><i></i>{{ data()!.active_calls }} on the line</span> }
    </div>
  </div>


  <!-- The calling report (Calling-Report-Logic.md v1): the same component and numbers as Echo. Every number on this page comes from it. -->
  <app-live-calls [source]="liveSource"></app-live-calls>
  <app-calling-report [source]="reportSource" workspace="Moglix" (scopeChange)="onReportScope($event)"></app-calling-report>

</div>
